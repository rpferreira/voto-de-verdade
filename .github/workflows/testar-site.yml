name: Testar o site

# Abre o site num navegador de verdade e confere as telas principais.
# Roda em todo pull request que mexe no site, para não publicar nada quebrado.
on:
  pull_request:
    paths:
      - "site/**"
      - "testes/**"
      - "coleta/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fumaca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Conferir que os programas em Python não têm erro de escrita
        run: python -m py_compile coleta/*.py site/*.py testes/*.py

      - name: Instalar o navegador de teste
        run: |
          pip install -r testes/requirements.txt
          playwright install --with-deps chromium

      - name: Montar o site
        run: python site/gerar_paginas.py --saida _site

      - name: Testar
        run: python testes/fumaca.py _site

      - name: Conferir as regras de espaçamento (grade de 8px)
        run: python testes/espacamento.py _site

      # Ataca o próprio site com dados maliciosos (HTML, scripts, links javascript:) e confere a política de segurança.
      - name: Testar a segurança
        run: python testes/seguranca.py
