name: Atualização diária

# Roda todo dia às 6h (horário de Brasília) e também quando você clicar em "Run workflow".
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      limite_resumos:
        description: "Quantos projetos resumir com IA nesta execução (use 5 para um teste barato)"
        default: "300"
      ids:
        description: "Para testes: só estes projetos (ids separados por vírgula). Deixe vazio para o normal"
        default: ""
      reavaliar:
        description: "Só refazer as confianças dos resumos já feitos, sem chamar a IA e sem gastar (sim ou nao)"
        default: "nao"
      espalhar:
        description: "Para testes: pegar projetos espalhados por toda a lista, e não só os mais recentes (sim ou nao)"
        default: "nao"
      limite_traducoes:
        description: "Quantos projetos e votações traduzir para o inglês nesta execução (use 5 para um teste barato)"
        default: "400"

permissions:
  contents: write
  issues: write

# Nunca duas atualizações ao mesmo tempo.
concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar o Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Coletar os dados da Câmara
        id: coleta
        working-directory: dados
        run: python ../coleta/coletar_votacoes.py --diario

      # Guarda o cache mesmo se a coleta falhou.
      - name: Guardar o que já foi coletado, mesmo se a coleta falhou
        if: always()
        run: bash coleta/guardar_no_repositorio.sh "Atualização diária dos dados" dados/cache_v5.json

      - name: Construir o banco de dados
        id: banco
        if: steps.coleta.outcome == 'success'
        run: python coleta/construir_banco.py

      # Assunto e resumo por IA, só dos projetos novos. Sem a chave ANTHROPIC_API_KEY, esta etapa é pulada.
      - name: Resumir os projetos novos com IA
        if: steps.coleta.outcome == 'success' && steps.banco.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE_RESUMOS: ${{ github.event.inputs.limite_resumos || '300' }}
          ESPALHAR: ${{ github.event.inputs.espalhar || 'nao' }}
          IDS: ${{ github.event.inputs.ids || '' }}
          REAVALIAR: ${{ github.event.inputs.reavaliar || 'nao' }}
        run: |
          if [ "$REAVALIAR" = "sim" ]; then
            python coleta/resumir_projetos.py --reavaliar
            exit 0
          fi
          EXTRA=""
          if [ "$ESPALHAR" = "sim" ]; then EXTRA="--espalhar"; fi
          python coleta/resumir_projetos.py --limite "$LIMITE_RESUMOS" --tempo-max 80 --ids "$IDS" $EXTRA

      - name: Guardar os resumos, mesmo se a etapa anterior falhou
        if: always()
        run: bash coleta/guardar_no_repositorio.sh "Resumos dos projetos (IA)" dados/resumos.json dados/custo.json

      # Refaz o banco, agora com os resumos.
      - name: Construir o banco de dados com os resumos
        if: steps.coleta.outcome == 'success'
        run: python coleta/construir_banco.py

      # Dados que o site lê (pasta site/dados).
      - name: Preparar os dados do site
        id: site
        if: steps.coleta.outcome == 'success'
        run: python site/exportar_dados.py

      # Tradução para o inglês, só dos projetos e votações novos (ou cujo texto em português mudou). Sem a chave
      # ANTHROPIC_API_KEY, a etapa é pulada. Uma falha aqui não impede a atualização: o que ficar sem tradução
      # aparece em português no site em inglês, e o monitoramento avisa quando são muitos.
      - name: Traduzir para o inglês os projetos novos com IA
        id: traducao
        if: steps.site.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE_TRADUCOES: ${{ github.event.inputs.limite_traducoes || '400' }}
        run: python coleta/traduzir_projetos.py --limite "$LIMITE_TRADUCOES" --tempo-max 40

      - name: Guardar as traduções, mesmo se a etapa anterior falhou
        if: always() && steps.site.outcome == 'success'
        run: bash coleta/guardar_no_repositorio.sh "Traduções para o inglês (IA)" dados/traducoes_en.json dados/custo.json

      # O texto em inglês que o site lê (site/dados/en), refeito com as traduções de agora.
      - name: Preparar os dados em inglês
        if: steps.site.outcome == 'success'
        run: python site/exportar_en.py

      - name: Guardar os dados do site no repositório
        if: steps.site.outcome == 'success'
        run: bash coleta/guardar_no_repositorio.sh "Dados do site" site/dados dados/primeira_vez.json  # a data em que cada projeto entrou no site (etiqueta «Novo»)

      # Fotos dos deputados (só as que faltam). Uma falha aqui não impede a atualização.
      - name: Guardar as fotos dos deputados
        if: steps.site.outcome == 'success'
        continue-on-error: true
        run: |
          pip install pillow==12.3.0  # reduz cada foto para 192 px de largura (site/baixar_fotos.py)
          python site/baixar_fotos.py
          bash coleta/guardar_no_repositorio.sh "Fotos dos deputados" site/fotos

      - name: Guardar o banco para consulta (7 dias)
        if: steps.coleta.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banco-de-dados
          path: dados/voto_de_verdade.db
          retention-days: 7
          if-no-files-found: error

  # Põe o site no ar (GitHub Pages) com os dados de hoje. Se falhar, esta execução fica vermelha.
  publicar:
    needs: atualizar
    if: needs.atualizar.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar-site.yml

  # Foto (PNG) da tela "Em números" com os dados de hoje: fica anexada a esta execução e em painel/ultima-geracao.png.
  # Os números do painel (site/dados/painel.json) já são refeitos na etapa "Preparar os dados do site".
  painel:
    needs: atualizar
    if: needs.atualizar.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/painel-imagem.yml

  # Confere custo, dados e site no ar. Se achar problema, esta execução fica vermelha (o GitHub avisa por e-mail)
  # e um alerta é aberto na aba Issues; ele fecha sozinho quando tudo volta ao normal.
  # Roda mesmo se a atualização ou a publicação falharam, justamente para avisar disso.
  monitorar:
    needs: [atualizar, publicar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Baixar o repositório (versão de agora, com os dados de hoje)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Instalar o Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Conferir
        env:
          GH_TOKEN: ${{ github.token }}
          LIMITE_CUSTO_RODADA: ${{ vars.LIMITE_CUSTO_RODADA }}
          LIMITE_CUSTO_MES: ${{ vars.LIMITE_CUSTO_MES }}
          LIMITE_PENDENTES: ${{ vars.LIMITE_PENDENTES }}
          DIAS_SEM_VOTACAO: ${{ vars.DIAS_SEM_VOTACAO }}
          LIMITE_INCERTOS: ${{ vars.LIMITE_INCERTOS }}
        run: |
          python coleta/monitorar.py \
            --site "https://votodeverdade.com.br" \
            --atualizar "${{ needs.atualizar.result }}" \
            --publicar "${{ needs.publicar.result }}" \
            --execucao-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --salvar --alerta

      # Guarda o histórico mesmo se a conferência achou problemas. Como muda todo dia, também mantém o
      # repositório "ativo" (o GitHub desliga rotinas agendadas de repositórios parados por 60 dias).
      - name: Guardar o histórico da conferência
        if: always()
        run: bash coleta/guardar_no_repositorio.sh "Histórico do monitoramento" dados/monitor.json
