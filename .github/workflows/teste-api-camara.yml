name: Atualização diária

# Roda todo dia às 6h (horário de Brasília) e também quando você clicar em "Run workflow".
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nunca duas atualizações ao mesmo tempo.
concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar os dados da Câmara
        id: coleta
        working-directory: dados
        run: python ../coleta/coletar_votacoes.py --diario

      # Guarda o cache mesmo se a coleta falhou. Se alguém mexeu no repositório enquanto a coleta
      # rodava, junta as novidades antes de enviar e tenta de novo, para não perder o trabalho.
      - name: Guardar o que já foi coletado, mesmo se a coleta falhou
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/cache_v5.json
          if git diff --cached --quiet; then
            echo "Nada novo para guardar."
            exit 0
          fi
          git commit -m "Atualização diária dos dados"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Cache guardado."
              exit 0
            fi
            echo "Não consegui enviar na tentativa $tentativa. Vou tentar de novo em 15 segundos."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "ERRO: não foi possível guardar o cache no repositório."
          exit 1

      # O banco é montado sempre que a coleta terminou bem, mesmo se o envio do cache falhou.
      - name: Construir o banco de dados
        if: steps.coleta.outcome == 'success'
        run: python coleta/construir_banco.py

      - name: Guardar o banco para consulta (7 dias)
        if: steps.coleta.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: banco-de-dados
          path: dados/voto_de_verdade.db
          retention-days: 7
          if-no-files-found: error
