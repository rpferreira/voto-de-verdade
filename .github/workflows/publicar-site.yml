name: Publicar o site

# Põe o site no ar (GitHub Pages) toda vez que algo da pasta site/ muda no ramo principal,
# e também depois da atualização diária (que chama este fluxo). Se falhar, a execução fica
# vermelha e o GitHub avisa por e-mail.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publicar-site.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pagina.outputs.page_url }}
    steps:
      - name: Baixar o repositório já atualizado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Instalar o Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Preparar o site
        id: config
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Copia o site e cria uma página para cada projeto, deputado e assunto (título e prévia próprios).
      - name: Montar as páginas
        run: python site/gerar_paginas.py --saida _site --url "${{ steps.config.outputs.base_url }}"

      - name: Juntar os arquivos do site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Publicar
        id: pagina
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
